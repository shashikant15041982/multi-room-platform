<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Room Platform - Session 5 (Advanced Handoff Detection)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .home-view {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .room-card {
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .room-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 12px rgba(0, 0, 0, 0.15);
        }

        .room-card h2 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 1.5em;
        }

        .card-stat {
            margin: 10px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid #eee;
        }

        .card-stat:last-child {
            border-bottom: none;
        }

        .card-stat label {
            font-weight: 600;
            color: #666;
        }

        .card-stat value {
            color: #667eea;
            font-weight: bold;
            font-size: 1.1em;
        }

        .ai-helpers {
            margin: 15px 0;
            padding: 10px;
            background: #f5f5f5;
            border-radius: 5px;
        }

        .ai-helpers label {
            display: block;
            font-weight: 600;
            color: #666;
            margin-bottom: 8px;
        }

        .ai-list {
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
        }

        .ai-badge {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 600;
        }

        .integrity-badge {
            display: inline-block;
            background: #10b981;
            color: white;
            padding: 4px 10px;
            border-radius: 5px;
            font-size: 0.85em;
            margin-top: 10px;
            font-weight: 600;
        }

        .token-badge {
            display: inline-block;
            background: #f59e0b;
            color: white;
            padding: 4px 10px;
            border-radius: 5px;
            font-size: 0.85em;
            margin-top: 10px;
            font-weight: 600;
        }

        .token-warning {
            display: inline-block;
            background: #ef4444;
            color: white;
            padding: 6px 12px;
            border-radius: 5px;
            font-size: 0.9em;
            margin-top: 10px;
            font-weight: 600;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        .room-views {
            display: none;
        }

        .room-views.active {
            display: block;
        }

        .room-view {
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .back-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1em;
            margin-bottom: 20px;
        }

        .back-btn:hover {
            background: #764ba2;
        }

        .run-btn {
            background: #10b981;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1em;
            font-weight: 600;
            margin: 20px 0;
            margin-right: 10px;
        }

        .run-btn:hover:not(:disabled) {
            background: #059669;
        }

        .run-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            opacity: 0.6;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin: 20px 0;
            border-bottom: 2px solid #eee;
            overflow-x: auto;
        }

        .tab-btn {
            background: none;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            font-size: 1em;
            color: #666;
            border-bottom: 3px solid transparent;
            transition: all 0.3s ease;
            white-space: nowrap;
        }

        .tab-btn:hover {
            color: #667eea;
        }

        .tab-btn.active {
            color: #667eea;
            border-bottom-color: #667eea;
        }

        .tab-content {
            display: none;
            padding: 20px 0;
        }

        .tab-content.active {
            display: block;
        }

        .content-block {
            margin: 15px 0;
            padding: 15px;
            background: #f5f5f5;
            border-radius: 5px;
            border-left: 4px solid #667eea;
        }

        .content-block label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #333;
        }

        .content-block value {
            display: block;
            color: #667eea;
            font-family: 'Courier New', monospace;
            word-break: break-all;
        }

        .history-item {
            background: white;
            padding: 12px;
            margin: 10px 0;
            border-left: 4px solid #667eea;
            border-radius: 4px;
        }

        .history-item-time {
            font-size: 0.85em;
            color: #999;
            margin-bottom: 5px;
        }

        .history-item-content {
            color: #333;
            font-size: 0.95em;
            line-height: 1.4;
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #eee;
        }

        .stat-label {
            font-weight: 600;
            color: #666;
        }

        .stat-value {
            color: #667eea;
            font-weight: bold;
        }

        .context-bar {
            background: #e5e7eb;
            border-radius: 5px;
            height: 20px;
            margin: 10px 0;
            overflow: hidden;
        }

        .context-fill {
            background: linear-gradient(90deg, #667eea, #764ba2);
            height: 100%;
            transition: width 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding-right: 5px;
            color: white;
            font-size: 0.75em;
            font-weight: bold;
        }

        .token-monitor-section {
            background: #fff3cd;
            padding: 15px;
            border-radius: 5px;
            margin: 15px 0;
            border-left: 4px solid #ffc107;
        }

        .token-alert-critical {
            background: #f8d7da;
            padding: 12px;
            border-radius: 5px;
            margin: 10px 0;
            border-left: 4px solid #dc3545;
            color: #721c24;
        }

        .token-budget-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 10px;
            margin: 15px 0;
        }

        .token-budget-card {
            background: white;
            padding: 12px;
            border-radius: 5px;
            border: 2px solid #e5e7eb;
        }

        .token-budget-card.warning {
            border-color: #ffc107;
            background: #fffbf0;
        }

        .token-budget-card.critical {
            border-color: #dc3545;
            background: #fff5f5;
        }

        .token-ai-name {
            font-weight: 600;
            color: #667eea;
            margin-bottom: 5px;
            font-size: 0.95em;
        }

        .token-progress {
            background: #e5e7eb;
            border-radius: 3px;
            height: 15px;
            margin: 8px 0;
            overflow: hidden;
        }

        .token-progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #10b981, #fbbf24, #ef4444);
            transition: width 0.3s ease;
        }

        .token-stats {
            font-size: 0.8em;
            color: #666;
            margin-top: 5px;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #999;
        }

        .empty-state-icon {
            font-size: 3em;
            margin-bottom: 15px;
        }

        @media (max-width: 768px) {
            header h1 {
                font-size: 1.8em;
            }

            .home-view {
                grid-template-columns: 1fr;
            }

            .tabs {
                overflow-x: auto;
                -webkit-overflow-scrolling: touch;
            }

            .tab-btn {
                padding: 8px 12px;
                font-size: 0.9em;
            }

            .token-budget-grid {
                grid-template-columns: 1fr;
            }

            .run-btn {
                margin-right: 5px;
                padding: 10px 16px;
                font-size: 0.95em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🚀 Multi-Room Platform</h1>
            <p>Session 5: Advanced Handoff Detection with Token Monitoring</p>
        </header>

        <div id="homeView" class="home-view"></div>
        <div id="roomViews"></div>
    </div>

    <script>
        // ==================== CONFIG ====================
        const TOKEN_BUDGET_PER_AI = {
            'Claude': 100000,
            'ChatGPT': 80000,
            'DeepSeek': 60000,
            'Mistral': 50000
        };

        const TOKEN_THRESHOLD_WARNING = 0.70; // 70% warning
        const TOKEN_THRESHOLD_CRITICAL = 0.85; // 85% critical - trigger proactive handoff

        // ==================== INITIALIZATION ====================
        let appState = {
            rooms: {
                1: { id: 1, title: 'Room 1', status: 'active', helpers: ['Claude', 'ChatGPT', 'DeepSeek', 'Mistral'], currentAI: 'Claude', messageCount: 0, lastRun: null, emailsSent: 0, lastContextHash: null, tokenUsed: 0, executions: [], emails: [], relayEvents: [], relayStats: {}, integrityChecks: [], tokenHistory: [] },
                2: { id: 2, title: 'Room 2', status: 'empty', helpers: ['ChatGPT', 'DeepSeek', 'Claude', 'Mistral'], currentAI: 'ChatGPT', messageCount: 0, lastRun: null, emailsSent: 0, lastContextHash: null, tokenUsed: 0, executions: [], emails: [], relayEvents: [], relayStats: {}, integrityChecks: [], tokenHistory: [] },
                3: { id: 3, title: 'Room 3', status: 'empty', helpers: ['DeepSeek', 'Claude', 'ChatGPT', 'Mistral'], currentAI: 'DeepSeek', messageCount: 0, lastRun: null, emailsSent: 0, lastContextHash: null, tokenUsed: 0, executions: [], emails: [], relayEvents: [], relayStats: {}, integrityChecks: [], tokenHistory: [] }
            },
            messages: { 1: [], 2: [], 3: [] }
        };

        // Load from localStorage
        try {
            const saved = localStorage.getItem('appState');
            if (saved) {
                const loaded = JSON.parse(saved);
                Object.keys(appState.rooms).forEach(roomId => {
                    if (loaded.rooms && loaded.rooms[roomId]) {
                        appState.rooms[roomId] = {
                            ...appState.rooms[roomId],
                            ...loaded.rooms[roomId],
                            tokenHistory: loaded.rooms[roomId].tokenHistory || [],
                            integrityChecks: loaded.rooms[roomId].integrityChecks || []
                        };
                    }
                });
                if (loaded.messages) appState.messages = loaded.messages;
            }
        } catch (e) {
            console.error('Error loading state:', e);
        }

        // ==================== TOKEN FUNCTIONS ====================
        function getTokenBudget(aiName) {
            return TOKEN_BUDGET_PER_AI[aiName] || 100000;
        }

        function calculateTokenUsagePercent(roomId) {
            const room = appState.rooms[roomId];
            const aiName = room.currentAI;
            const budget = getTokenBudget(aiName);
            return (room.tokenUsed / budget) * 100;
        }

        function checkTokenThreshold(roomId) {
            const percent = calculateTokenUsagePercent(roomId) / 100;
            const room = appState.rooms[roomId];

            if (percent >= TOKEN_THRESHOLD_CRITICAL) {
                return { level: 'critical', message: '🚨 CRITICAL: 85%+ tokens - Proactive handoff required!' };
            }
            if (percent >= TOKEN_THRESHOLD_WARNING) {
                return { level: 'warning', message: '⚠️ WARNING: 70%+ tokens - Handoff recommended soon' };
            }
            return { level: 'normal', message: '✅ Normal token usage' };
        }

        function proactiveHandoff(roomId) {
            const room = appState.rooms[roomId];
            const currentAIIndex = room.helpers.indexOf(room.currentAI);
            const nextAIIndex = (currentAIIndex + 1) % room.helpers.length;
            const nextAI = room.helpers[nextAIIndex];

            const relayEvent = {
                timestamp: new Date().toISOString(),
                fromAI: room.currentAI,
                toAI: nextAI,
                messageCount: room.messageCount,
                contextKB: Math.ceil(room.tokenUsed / 250),
                preHandoffHash: room.lastContextHash,
                postHandoffHash: room.lastContextHash,
                integrityVerified: true,
                messagesTransferred: room.messageCount,
                reason: 'Proactive handoff (85% token threshold reached)'
            };

            room.relayEvents.push(relayEvent);
            room.tokenUsed = 0;
            room.currentAI = nextAI;
            room.messageCount = 0;

            if (!room.relayStats[nextAI]) {
                room.relayStats[nextAI] = { handoffs: 0, messagesHandled: 0, totalContextKB: 0 };
            }
            room.relayStats[nextAI].handoffs++;

            room.tokenHistory.push({
                timestamp: new Date().toISOString(),
                aiName: nextAI,
                tokensUsed: 0,
                percentUsed: 0,
                reason: 'Proactive handoff triggered'
            });

            saveState();
            return { success: true, nextAI };
        }

        function recordTokenUsage(roomId, tokensUsed) {
            const room = appState.rooms[roomId];
            room.tokenUsed += tokensUsed;

            room.tokenHistory.push({
                timestamp: new Date().toISOString(),
                aiName: room.currentAI,
                tokensUsed: tokensUsed,
                percentUsed: calculateTokenUsagePercent(roomId),
                reason: 'Execution'
            });

            const threshold = checkTokenThreshold(roomId);
            if (threshold.level === 'critical') {
                proactiveHandoff(roomId);
            }

            saveState();
        }

        // ==================== HASH & INTEGRITY ====================
        function simpleHash(str) {
            let hash = 0;
            for (let i = 0; i < (str || '').length; i++) {
                const char = (str || '').charCodeAt(i);
                hash = ((hash << 5) - hash) + char;
                hash = hash & hash;
            }
            return Math.abs(hash).toString(16).padStart(8, '0');
        }

        function generateContextHash(roomId) {
            const messages = (appState.messages[roomId] || []).map(m => m.text).join('|');
            return simpleHash(messages);
        }

        // ==================== EXECUTION ====================
        function runExecution(roomId) {
            try {
                const room = appState.rooms[roomId];
                const estimatedTokens = Math.floor(Math.random() * 5000) + 2000;
                const jobsFound = Math.floor(Math.random() * 50) + 10;
                const highMatch = Math.floor(jobsFound * 0.3);

                const execution = {
                    timestamp: new Date().toISOString(),
                    jobsFound: jobsFound,
                    highMatch: highMatch,
                    duration: Math.floor(Math.random() * 3) + 1,
                    tokensUsed: estimatedTokens
                };

                room.executions.push(execution);
                room.messageCount++;
                room.lastRun = execution.timestamp;
                room.status = 'active';
                recordTokenUsage(roomId, estimatedTokens);

                if (!appState.messages[roomId]) appState.messages[roomId] = [];
                appState.messages[roomId].push({
                    type: 'execution',
                    text: `Execution: Found ${jobsFound} jobs, ${highMatch} high match`,
                    timestamp: execution.timestamp
                });

                room.lastContextHash = generateContextHash(roomId);

                if (room.messageCount > 20 && room.messageCount % 20 === 1) {
                    triggerRelay(roomId);
                }

                saveState();
                renderUI();
            } catch (e) {
                console.error('Execution error:', e);
            }
        }

        // ==================== RELAY ====================
        function triggerRelay(roomId) {
            try {
                const room = appState.rooms[roomId];
                const currentAIIndex = room.helpers.indexOf(room.currentAI);
                const nextAIIndex = (currentAIIndex + 1) % room.helpers.length;
                const nextAI = room.helpers[nextAIIndex];

                const relayEvent = {
                    timestamp: new Date().toISOString(),
                    fromAI: room.currentAI,
                    toAI: nextAI,
                    messageCount: room.messageCount,
                    contextKB: Math.ceil(room.tokenUsed / 250),
                    preHandoffHash: room.lastContextHash,
                    postHandoffHash: room.lastContextHash,
                    integrityVerified: room.lastContextHash !== null,
                    messagesTransferred: room.messageCount,
                    reason: 'Message count threshold (20+) reached'
                };

                room.relayEvents.push(relayEvent);
                room.currentAI = nextAI;
                room.messageCount = 0;
                room.tokenUsed = 0;

                if (!room.relayStats[nextAI]) {
                    room.relayStats[nextAI] = { handoffs: 0, messagesHandled: 0, totalContextKB: 0 };
                }
                room.relayStats[nextAI].handoffs++;
                room.relayStats[nextAI].messagesHandled = (room.relayStats[nextAI].messagesHandled || 0) + relayEvent.messageCount;
                room.relayStats[nextAI].totalContextKB = (room.relayStats[nextAI].totalContextKB || 0) + relayEvent.contextKB;

                saveState();
            } catch (e) {
                console.error('Relay error:', e);
            }
        }

        // ==================== EMAIL ====================
        function sendEmail(roomId) {
            try {
                const room = appState.rooms[roomId];
                const email = {
                    timestamp: new Date().toISOString(),
                    to: `recruiter${Math.floor(Math.random() * 100)}@company.com`,
                    subject: `Profile Match - ${room.messageCount} jobs found`,
                    preview: `Found ${room.messageCount} matching positions`,
                    status: 'sent'
                };

                room.emails.push(email);
                room.emailsSent++;
                saveState();
                renderUI();
            } catch (e) {
                console.error('Email error:', e);
            }
        }

        // ==================== STATE MANAGEMENT ====================
        function saveState() {
            try {
                localStorage.setItem('appState', JSON.stringify(appState));
            } catch (e) {
                console.error('Save error:', e);
            }
        }

        function formatTime(isoString) {
            try {
                return new Date(isoString).toLocaleTimeString();
            } catch {
                return isoString;
            }
        }

        // ==================== RENDERING ====================
        function renderHome() {
            return `
                ${Object.values(appState.rooms).map(room => `
                    <div class="room-card">
                        <h2>${room.title}</h2>
                        <div class="card-stat">
                            <label>Status:</label>
                            <value>${room.status}</value>
                        </div>
                        <div class="card-stat">
                            <label>Current AI:</label>
                            <value>${room.currentAI}</value>
                        </div>
                        <div class="card-stat">
                            <label>Executions:</label>
                            <value>${room.executions.length}</value>
                        </div>
                        <div class="card-stat">
                            <label>Relays:</label>
                            <value>${room.relayEvents.length}</value>
                        </div>
                        <div class="card-stat">
                            <label>Emails Sent:</label>
                            <value>${room.emailsSent}</value>
                        </div>
                        <div class="ai-helpers">
                            <label>Available AIs:</label>
                            <div class="ai-list">${room.helpers.map(ai => `<span class="ai-badge">${ai}</span>`).join('')}</div>
                        </div>
                        ${room.relayEvents.length > 0 ? '<span class="integrity-badge">🔐 VERIFIED</span>' : ''}
                        ${checkTokenThreshold(room.id).level === 'critical' ? '<span class="token-warning">⚠️ Token Alert!</span>' : ''}
                        ${checkTokenThreshold(room.id).level === 'warning' ? '<span class="token-badge">📊 Token Warning</span>' : ''}
                        <button class="run-btn" onclick="enterRoom(${room.id})">Enter Room</button>
                    </div>
                `).join('')}
            `;
        }

        function renderRoom(roomId) {
            try {
                const room = appState.rooms[roomId];
                if (!room) return '<div class="room-view"><p>Room not found</p></div>';

                const threshold = checkTokenThreshold(roomId);
                const tokenPercent = calculateTokenUsagePercent(roomId);

                return `
                    <div class="room-view">
                        <button class="back-btn" onclick="backToHome()">← Back to Home</button>
                        <h2>${room.title}</h2>

                        ${threshold.level === 'critical' ? `<div class="token-alert-critical">🚨 ${threshold.message}</div>` : ''}
                        ${threshold.level === 'warning' ? `<div class="token-monitor-section">⚠️ ${threshold.message}</div>` : ''}

                        <button class="run-btn" onclick="runExecution(${roomId}); setTimeout(() => renderUI(), 500)">▶ RUN NOW</button>
                        <button class="run-btn" style="background: #3b82f6;" onclick="sendEmail(${roomId}); setTimeout(() => renderUI(), 500)">✉️ SEND EMAIL</button>

                        <div class="tabs">
                            <button class="tab-btn active" onclick="switchTab(${roomId}, 'code')">CODE</button>
                            <button class="tab-btn" onclick="switchTab(${roomId}, 'output')">OUTPUT</button>
                            <button class="tab-btn" onclick="switchTab(${roomId}, 'history')">HISTORY</button>
                            <button class="tab-btn" onclick="switchTab(${roomId}, 'emails')">EMAILS</button>
                            <button class="tab-btn" onclick="switchTab(${roomId}, 'relay')">RELAY</button>
                            <button class="tab-btn" onclick="switchTab(${roomId}, 'relay-stats')">RELAY STATS</button>
                            <button class="tab-btn" onclick="switchTab(${roomId}, 'integrity')">INTEGRITY</button>
                            <button class="tab-btn" onclick="switchTab(${roomId}, 'token-monitor')">TOKEN MONITOR</button>
                        </div>

                        <div id="tab-code-${roomId}" class="tab-content active">
                            <div class="content-block">
                                <label>Room Configuration</label>
                                <value>ID: ${room.id}, Title: ${room.title}, Current AI: ${room.currentAI}</value>
                            </div>
                            <div class="content-block">
                                <label>AI Helpers Available</label>
                                <value>${room.helpers.join(', ')}</value>
                            </div>
                        </div>

                        <div id="tab-output-${roomId}" class="tab-content">
                            ${room.executions.length > 0
                                ? room.executions.slice(-5).reverse().map((exec, idx) => `
                                    <div class="history-item">
                                        <div class="history-item-time">${formatTime(exec.timestamp)}</div>
                                        <div class="history-item-content">
                                            ✓ Found ${exec.jobsFound} jobs (${exec.highMatch} high match) | ${exec.duration}s | ~${exec.tokensUsed} tokens
                                        </div>
                                    </div>
                                `).join('')
                                : '<div class="empty-state"><div class="empty-state-icon">📭</div>No executions yet</div>'
                            }
                        </div>

                        <div id="tab-history-${roomId}" class="tab-content">
                            ${appState.messages[roomId] && appState.messages[roomId].length > 0
                                ? appState.messages[roomId].slice().reverse().map(msg => `
                                    <div class="history-item">
                                        <div class="history-item-time">${formatTime(msg.timestamp)}</div>
                                        <div class="history-item-content">${msg.text}</div>
                                    </div>
                                `).join('')
                                : '<div class="empty-state"><div class="empty-state-icon">💬</div>No message history</div>'
                            }
                        </div>

                        <div id="tab-emails-${roomId}" class="tab-content">
                            ${room.emails.length > 0
                                ? room.emails.slice().reverse().map(email => `
                                    <div class="history-item">
                                        <div class="history-item-time">${formatTime(email.timestamp)}</div>
                                        <div class="history-item-content">
                                            <strong>To:</strong> ${email.to}<br>
                                            <strong>Subject:</strong> ${email.subject}<br>
                                            <strong>Status:</strong> ${email.status}
                                        </div>
                                    </div>
                                `).join('')
                                : '<div class="empty-state"><div class="empty-state-icon">📧</div>No emails sent</div>'
                            }
                        </div>

                        <div id="tab-relay-${roomId}" class="tab-content">
                            ${room.relayEvents.length > 0
                                ? room.relayEvents.slice().reverse().map(event => `
                                    <div class="history-item">
                                        <div class="history-item-time">${formatTime(event.timestamp)}</div>
                                        <div class="history-item-content">
                                            🔄 ${event.fromAI} → ${event.toAI}<br>
                                            Messages: ${event.messageCount} | Context: ${event.contextKB}KB<br>
                                            Hash: ${event.preHandoffHash} | Verified: ${event.integrityVerified ? '✓' : '✗'}<br>
                                            Reason: ${event.reason}
                                        </div>
                                    </div>
                                `).join('')
                                : '<div class="empty-state"><div class="empty-state-icon">🔄</div>No relay events yet</div>'
                            }
                        </div>

                        <div id="tab-relay-stats-${roomId}" class="tab-content">
                            ${Object.keys(room.relayStats).length > 0
                                ? Object.entries(room.relayStats).map(([aiName, stats]) => {
                                    const avgContextPerHandoff = stats.handoffs > 0 ? (stats.totalContextKB / stats.handoffs).toFixed(2) : 0;
                                    const contextPercent = Math.min((stats.totalContextKB / 500) * 100, 100);
                                    return `
                                        <div class="content-block">
                                            <label>${aiName}</label>
                                            <div class="stat-row"><span class="stat-label">Handoffs:</span><span class="stat-value">${stats.handoffs}</span></div>
                                            <div class="stat-row"><span class="stat-label">Messages Handled:</span><span class="stat-value">${stats.messagesHandled}</span></div>
                                            <div class="stat-row"><span class="stat-label">Total Context (KB):</span><span class="stat-value">${stats.totalContextKB}</span></div>
                                            <div class="stat-row"><span class="stat-label">Avg Context/Handoff (KB):</span><span class="stat-value">${avgContextPerHandoff}</span></div>
                                            <div class="context-bar">
                                                <div class="context-fill" style="width: ${contextPercent}%"></div>
                                            </div>
                                        </div>
                                    `;
                                }).join('')
                                : '<div class="empty-state"><div class="empty-state-icon">📊</div>No relay statistics yet</div>'
                            }
                        </div>

                        <div id="tab-integrity-${roomId}" class="tab-content">
                            ${room.integrityChecks.length > 0
                                ? `
                                    <div class="content-block" style="background: #f0fdf4; border-left-color: #10b981;">
                                        <div class="stat-row">
                                            <span class="stat-label">Integrity Status:</span>
                                            <span class="stat-value">✓ VERIFIED</span>
                                        </div>
                                        <div class="stat-row">
                                            <span class="stat-label">Total Checks:</span>
                                            <span class="stat-value">${room.integrityChecks.length}</span>
                                        </div>
                                        <div class="stat-row">
                                            <span class="stat-label">Last Context Hash:</span>
                                            <span class="stat-value" style="font-family: monospace; font-size: 0.9em;">${room.lastContextHash}</span>
                                        </div>
                                    </div>
                                `
                                : '<div class="empty-state"><div class="empty-state-icon">🔐</div>No integrity checks yet (triggered on relay)</div>'
                            }
                        </div>

                        <div id="tab-token-monitor-${roomId}" class="tab-content">
                            <div class="token-monitor-section">
                                <div class="stat-row">
                                    <span class="stat-label">Current AI:</span>
                                    <span class="stat-value">${room.currentAI}</span>
                                </div>
                                <div class="stat-row">
                                    <span class="stat-label">Tokens Used:</span>
                                    <span class="stat-value">${room.tokenUsed.toLocaleString()}</span>
                                </div>
                                <div class="stat-row">
                                    <span class="stat-label">Budget:</span>
                                    <span class="stat-value">${getTokenBudget(room.currentAI).toLocaleString()}</span>
                                </div>
                                <div class="stat-row">
                                    <span class="stat-label">Usage %:</span>
                                    <span class="stat-value">${tokenPercent.toFixed(2)}%</span>
                                </div>
                                <div class="token-progress">
                                    <div class="token-progress-fill" style="width: ${Math.min(tokenPercent, 100)}%"></div>
                                </div>
                                <div class="stat-row" style="margin-top: 10px;">
                                    <span class="stat-label">Status:</span>
                                    <span class="stat-value">${threshold.message}</span>
                                </div>
                            </div>

                            <h3 style="margin: 20px 0 10px 0; color: #667eea; font-size: 1.1em;">All AI Token Budgets</h3>
                            <div class="token-budget-grid">
                                ${room.helpers.map(aiName => {
                                    const budget = getTokenBudget(aiName);
                                    const used = room.tokenUsed;
                                    const percent = (used / budget) * 100;
                                    const isWarning = percent >= TOKEN_THRESHOLD_WARNING * 100;
                                    const isCritical = percent >= TOKEN_THRESHOLD_CRITICAL * 100;
                                    return `
                                        <div class="token-budget-card ${isCritical ? 'critical' : isWarning ? 'warning' : ''}">
                                            <div class="token-ai-name">${aiName}</div>
                                            <div class="token-progress">
                                                <div class="token-progress-fill" style="width: ${Math.min(percent, 100)}%"></div>
                                            </div>
                                            <div class="token-stats">
                                                ${used.toLocaleString()} / ${budget.toLocaleString()} (${percent.toFixed(1)}%)
                                            </div>
                                        </div>
                                    `;
                                }).join('')}
                            </div>

                            <h3 style="margin: 20px 0 10px 0; color: #667eea; font-size: 1.1em;">Token Usage History (Last 10)</h3>
                            ${room.tokenHistory.length > 0
                                ? room.tokenHistory.slice(-10).reverse().map(entry => `
                                    <div class="history-item">
                                        <div class="history-item-time">${formatTime(entry.timestamp)} | ${entry.aiName}</div>
                                        <div class="history-item-content">
                                            Tokens: ${entry.tokensUsed} | Usage: ${entry.percentUsed.toFixed(2)}% | Reason: ${entry.reason}
                                        </div>
                                    </div>
                                `).join('')
                                : '<div class="empty-state" style="padding: 20px;"><div class="empty-state-icon">📊</div>No token history yet</div>'
                            }
                        </div>
                    </div>
                `;
            } catch (e) {
                console.error('Room render error:', e);
                return '<div class="room-view"><p>Error loading room. Please refresh.</p></div>';
            }
        }

        function renderUI() {
            try {
                const homeView = document.getElementById('homeView');
                const roomViewsContainer = document.getElementById('roomViews');

                homeView.innerHTML = renderHome();
                homeView.classList.add('active');

                roomViewsContainer.innerHTML = Object.keys(appState.rooms).map(roomId => `<div id="room-${roomId}" class="room-views">${renderRoom(roomId)}</div>`).join('');
            } catch (e) {
                console.error('UI render error:', e);
            }
        }

        function enterRoom(roomId) {
            try {
                document.getElementById('homeView').classList.remove('active');
                for (let id of Object.keys(appState.rooms)) {
                    document.getElementById(`room-${id}`).classList.remove('active');
                }
                document.getElementById(`room-${roomId}`).classList.add('active');
            } catch (e) {
                console.error('Enter room error:', e);
            }
        }

        function backToHome() {
            try {
                for (let id of Object.keys(appState.rooms)) {
                    document.getElementById(`room-${id}`).classList.remove('active');
                }
                document.getElementById('homeView').classList.add('active');
                renderUI();
            } catch (e) {
                console.error('Back home error:', e);
            }
        }

        function switchTab(roomId, tabName) {
            try {
                const tabButtons = document.querySelectorAll(`#room-${roomId} .tab-btn`);
                const tabContents = document.querySelectorAll(`#room-${roomId} .tab-content`);
                tabButtons.forEach(btn => btn.classList.remove('active'));
                tabContents.forEach(content => content.classList.remove('active'));
                document.querySelector(`#room-${roomId} [onclick*="'${tabName}'"]`).classList.add('active');
                document.getElementById(`tab-${tabName}-${roomId}`).classList.add('active');
            } catch (e) {
                console.error('Tab switch error:', e);
            }
        }

        // Initialize
        renderUI();
    </script>
</body>
</html>
