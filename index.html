<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Room Platform - Session 7 (OAuth & API Framework)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .login-view {
            display: none;
        }

        .login-view.active {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            z-index: 1000;
        }

        .login-card {
            background: white;
            border-radius: 10px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            max-width: 400px;
            width: 100%;
        }

        .login-card h1 {
            color: #667eea;
            margin-bottom: 30px;
            text-align: center;
            font-size: 1.8em;
        }

        .login-card p {
            color: #666;
            margin-bottom: 20px;
            text-align: center;
            font-size: 0.95em;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
        }

        .form-group input {
            width: 100%;
            padding: 10px;
            border: 2px solid #e5e7eb;
            border-radius: 5px;
            font-size: 1em;
            transition: border-color 0.3s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            margin-top: 20px;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .oauth-section {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid #e5e7eb;
        }

        .oauth-section p {
            font-size: 0.85em;
            color: #999;
            margin-bottom: 10px;
        }

        .oauth-buttons {
            display: flex;
            gap: 10px;
        }

        .oauth-btn {
            flex: 1;
            padding: 10px;
            border: 2px solid #e5e7eb;
            background: white;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
            color: #333;
            font-size: 0.9em;
            transition: all 0.3s ease;
        }

        .oauth-btn:hover {
            border-color: #667eea;
            color: #667eea;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 2.5em;
            margin: 0;
            flex: 1;
        }

        header p {
            font-size: 1.1em;
            opacity: 0.9;
            margin: 0;
        }

        .user-menu {
            background: rgba(255, 255, 255, 0.2);
            padding: 10px 20px;
            border-radius: 5px;
            color: white;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .user-email {
            font-weight: 600;
        }

        .logout-btn {
            background: rgba(255, 255, 255, 0.3);
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.3s ease;
        }

        .logout-btn:hover {
            background: rgba(255, 255, 255, 0.5);
        }

        .home-view {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .room-card {
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .room-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 12px rgba(0, 0, 0, 0.15);
        }

        .room-card h2 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 1.5em;
        }

        .card-stat {
            margin: 10px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid #eee;
        }

        .card-stat:last-child {
            border-bottom: none;
        }

        .card-stat label {
            font-weight: 600;
            color: #666;
        }

        .card-stat value {
            color: #667eea;
            font-weight: bold;
            font-size: 1.1em;
        }

        .ai-helpers {
            margin: 15px 0;
            padding: 10px;
            background: #f5f5f5;
            border-radius: 5px;
        }

        .ai-helpers label {
            display: block;
            font-weight: 600;
            color: #666;
            margin-bottom: 8px;
        }

        .ai-list {
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
        }

        .ai-badge {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 600;
        }

        .sync-badge {
            display: inline-block;
            background: #10b981;
            color: white;
            padding: 4px 10px;
            border-radius: 5px;
            font-size: 0.85em;
            margin-top: 10px;
            font-weight: 600;
        }

        .room-views {
            display: none;
        }

        .room-views.active {
            display: block;
        }

        .room-view {
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .back-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1em;
            margin-bottom: 20px;
        }

        .back-btn:hover {
            background: #764ba2;
        }

        .run-btn {
            background: #10b981;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1em;
            font-weight: 600;
            margin: 20px 0;
            margin-right: 10px;
        }

        .run-btn:hover:not(:disabled) {
            background: #059669;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin: 20px 0;
            border-bottom: 2px solid #eee;
            overflow-x: auto;
        }

        .tab-btn {
            background: none;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            font-size: 1em;
            color: #666;
            border-bottom: 3px solid transparent;
            transition: all 0.3s ease;
            white-space: nowrap;
        }

        .tab-btn:hover {
            color: #667eea;
        }

        .tab-btn.active {
            color: #667eea;
            border-bottom-color: #667eea;
        }

        .tab-content {
            display: none;
            padding: 20px 0;
        }

        .tab-content.active {
            display: block;
        }

        .content-block {
            margin: 15px 0;
            padding: 15px;
            background: #f5f5f5;
            border-radius: 5px;
            border-left: 4px solid #667eea;
        }

        .content-block label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #333;
        }

        .content-block value {
            display: block;
            color: #667eea;
            font-family: 'Courier New', monospace;
            word-break: break-all;
            font-size: 0.95em;
        }

        .history-item {
            background: white;
            padding: 12px;
            margin: 10px 0;
            border-left: 4px solid #667eea;
            border-radius: 4px;
        }

        .history-item-time {
            font-size: 0.85em;
            color: #999;
            margin-bottom: 5px;
        }

        .history-item-content {
            color: #333;
            font-size: 0.95em;
            line-height: 1.4;
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #eee;
        }

        .stat-label {
            font-weight: 600;
            color: #666;
        }

        .stat-value {
            color: #667eea;
            font-weight: bold;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #999;
        }

        .empty-state-icon {
            font-size: 3em;
            margin-bottom: 15px;
        }

        .sheets-structure {
            background: #f0fdf4;
            padding: 15px;
            border-radius: 5px;
            border-left: 4px solid #10b981;
            margin: 15px 0;
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
            white-space: pre-wrap;
            word-break: break-all;
        }

        .oauth-status {
            background: #eff6ff;
            padding: 15px;
            border-radius: 5px;
            border-left: 4px solid #3b82f6;
            margin: 15px 0;
        }

        .oauth-status-label {
            font-weight: 600;
            color: #1e40af;
            margin-bottom: 8px;
        }

        .oauth-status-value {
            color: #1e40af;
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
        }

        @media (max-width: 768px) {
            header {
                flex-direction: column;
                gap: 15px;
            }

            header h1 {
                font-size: 1.8em;
            }

            .user-menu {
                width: 100%;
                justify-content: center;
            }

            .home-view {
                grid-template-columns: 1fr;
            }

            .tabs {
                overflow-x: auto;
                -webkit-overflow-scrolling: touch;
            }

            .tab-btn {
                padding: 8px 12px;
                font-size: 0.9em;
            }

            .run-btn {
                margin-right: 5px;
                padding: 10px 16px;
                font-size: 0.95em;
            }

            .login-card {
                padding: 30px 20px;
                margin: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="login-view" id="loginView"></div>
    
    <div class="container">
        <header id="header" style="display: none;">
            <div>
                <h1>🚀 Multi-Room Platform</h1>
                <p>Session 7: OAuth & API Framework</p>
            </div>
            <div class="user-menu">
                <span class="user-email" id="userEmail"></span>
                <button class="logout-btn" onclick="logout()">Logout</button>
            </div>
        </header>

        <div id="homeView" class="home-view"></div>
        <div id="roomViews"></div>
    </div>

    <script>
        // ==================== OAUTH CONFIG ====================
        const OAUTH_CONFIG = {
            googleClientId: 'mock-client-id-12345.apps.googleusercontent.com',
            redirectUri: window.location.href.split('?')[0],
            scope: 'https://www.googleapis.com/auth/spreadsheets',
            tokenExpiry: 3600 // 1 hour
        };

        const GOOGLE_SHEETS_STRUCTURE = {
            sheetName: 'Multi-Room-Platform',
            tables: {
                rooms: {
                    name: 'Rooms',
                    columns: ['room_id', 'title', 'current_ai', 'status', 'executions', 'emails', 'relays', 'last_updated']
                },
                executions: {
                    name: 'Executions',
                    columns: ['execution_id', 'room_id', 'timestamp', 'jobs_found', 'high_match', 'duration', 'tokens_used']
                },
                relays: {
                    name: 'Relays',
                    columns: ['relay_id', 'room_id', 'from_ai', 'to_ai', 'message_count', 'context_kb', 'timestamp']
                },
                emails: {
                    name: 'Emails',
                    columns: ['email_id', 'room_id', 'recipient', 'subject', 'status', 'timestamp']
                },
                tokens: {
                    name: 'TokenHistory',
                    columns: ['entry_id', 'room_id', 'ai_name', 'tokens_used', 'percent_used', 'timestamp']
                }
            }
        };

        // ==================== AUTH STATE ====================
        let userSession = {
            isAuthenticated: false,
            email: null,
            accessToken: null,
            refreshToken: null,
            tokenExpiry: null,
            sheetsId: null,
            loginTime: null
        };

        // Load user session
        try {
            const saved = localStorage.getItem('userSession');
            if (saved) {
                userSession = { ...userSession, ...JSON.parse(saved) };
                if (userSession.tokenExpiry && new Date(userSession.tokenExpiry) > new Date()) {
                    // Token still valid
                } else {
                    userSession.isAuthenticated = false;
                }
            }
        } catch (e) {
            console.error('Session load error:', e);
        }

        // ==================== INITIALIZATION ====================
        let appState = {
            rooms: {
                1: { id: 1, title: 'Room 1', status: 'active', helpers: ['Claude', 'ChatGPT', 'DeepSeek', 'Mistral'], currentAI: 'Claude', messageCount: 0, lastRun: null, emailsSent: 0, lastContextHash: null, tokenUsed: 0, executions: [], emails: [], relayEvents: [], relayStats: {}, integrityChecks: [], tokenHistory: [] },
                2: { id: 2, title: 'Room 2', status: 'empty', helpers: ['ChatGPT', 'DeepSeek', 'Claude', 'Mistral'], currentAI: 'ChatGPT', messageCount: 0, lastRun: null, emailsSent: 0, lastContextHash: null, tokenUsed: 0, executions: [], emails: [], relayEvents: [], relayStats: {}, integrityChecks: [], tokenHistory: [] },
                3: { id: 3, title: 'Room 3', status: 'empty', helpers: ['DeepSeek', 'Claude', 'ChatGPT', 'Mistral'], currentAI: 'DeepSeek', messageCount: 0, lastRun: null, emailsSent: 0, lastContextHash: null, tokenUsed: 0, executions: [], emails: [], relayEvents: [], relayStats: {}, integrityChecks: [], tokenHistory: [] }
            },
            messages: { 1: [], 2: [], 3: [] }
        };

        // Load app state
        try {
            const saved = localStorage.getItem('appState');
            if (saved) {
                const loaded = JSON.parse(saved);
                Object.keys(appState.rooms).forEach(roomId => {
                    if (loaded.rooms && loaded.rooms[roomId]) {
                        appState.rooms[roomId] = {
                            ...appState.rooms[roomId],
                            ...loaded.rooms[roomId]
                        };
                    }
                });
                if (loaded.messages) appState.messages = loaded.messages;
            }
        } catch (e) {
            console.error('App state load error:', e);
        }

        // ==================== OAUTH FLOW ====================
        function simulateGoogleLogin() {
            const email = prompt('Enter email for Google OAuth simulation:');
            if (!email) return;

            userSession.isAuthenticated = true;
            userSession.email = email;
            userSession.accessToken = 'mock-access-token-' + Math.random().toString(36).substring(7);
            userSession.refreshToken = 'mock-refresh-token-' + Math.random().toString(36).substring(7);
            userSession.tokenExpiry = new Date(Date.now() + OAUTH_CONFIG.tokenExpiry * 1000).toISOString();
            userSession.sheetsId = 'mock-sheets-id-' + Math.random().toString(36).substring(7);
            userSession.loginTime = new Date().toISOString();

            saveUserSession();
            renderApp();
        }

        function logout() {
            userSession = {
                isAuthenticated: false,
                email: null,
                accessToken: null,
                refreshToken: null,
                tokenExpiry: null,
                sheetsId: null,
                loginTime: null
            };
            localStorage.removeItem('userSession');
            renderApp();
        }

        function saveUserSession() {
            try {
                localStorage.setItem('userSession', JSON.stringify(userSession));
            } catch (e) {
                console.error('Session save error:', e);
            }
        }

        function renderLogin() {
            return `
                <div class="login-card">
                    <h1>🚀 Multi-Room Platform</h1>
                    <p>Session 7: OAuth & API Framework</p>
                    
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="emailInput" placeholder="shashikant@example.com" value="${userSession.email || 'shashikant15041982@gmail.com'}">
                    </div>
                    
                    <button class="login-btn" onclick="loginWithEmail()">Sign In with Email</button>
                    
                    <div class="oauth-section">
                        <p>Or sign in with OAuth:</p>
                        <div class="oauth-buttons">
                            <button class="oauth-btn" onclick="simulateGoogleLogin()">Google</button>
                            <button class="oauth-btn" onclick="simulateOAuthLogin('github')">GitHub</button>
                        </div>
                    </div>
                </div>
            `;
        }

        function loginWithEmail() {
            const email = document.getElementById('emailInput').value;
            if (!email) {
                alert('Please enter email');
                return;
            }

            userSession.isAuthenticated = true;
            userSession.email = email;
            userSession.accessToken = 'mock-token-' + Math.random().toString(36).substring(7);
            userSession.tokenExpiry = new Date(Date.now() + OAUTH_CONFIG.tokenExpiry * 1000).toISOString();
            userSession.sheetsId = 'mock-sheets-' + Math.random().toString(36).substring(7);
            userSession.loginTime = new Date().toISOString();

            saveUserSession();
            renderApp();
        }

        function simulateOAuthLogin(provider) {
            const email = prompt(`Enter email for ${provider.toUpperCase()} OAuth:`);
            if (!email) return;

            userSession.isAuthenticated = true;
            userSession.email = email;
            userSession.accessToken = `mock-${provider}-token-` + Math.random().toString(36).substring(7);
            userSession.refreshToken = `mock-${provider}-refresh-` + Math.random().toString(36).substring(7);
            userSession.tokenExpiry = new Date(Date.now() + OAUTH_CONFIG.tokenExpiry * 1000).toISOString();
            userSession.sheetsId = 'mock-sheets-' + Math.random().toString(36).substring(7);
            userSession.loginTime = new Date().toISOString();

            saveUserSession();
            renderApp();
        }

        // ==================== TOKEN FUNCTIONS ====================
        const TOKEN_BUDGET_PER_AI = {
            'Claude': 100000,
            'ChatGPT': 80000,
            'DeepSeek': 60000,
            'Mistral': 50000
        };

        const TOKEN_THRESHOLD_WARNING = 0.70;
        const TOKEN_THRESHOLD_CRITICAL = 0.85;

        function getTokenBudget(aiName) {
            return TOKEN_BUDGET_PER_AI[aiName] || 100000;
        }

        function calculateTokenUsagePercent(roomId) {
            const room = appState.rooms[roomId];
            const aiName = room.currentAI;
            const budget = getTokenBudget(aiName);
            return (room.tokenUsed / budget) * 100;
        }

        function checkTokenThreshold(roomId) {
            const percent = calculateTokenUsagePercent(roomId) / 100;
            if (percent >= TOKEN_THRESHOLD_CRITICAL) {
                return { level: 'critical', message: '🚨 CRITICAL: 85%+ tokens' };
            }
            if (percent >= TOKEN_THRESHOLD_WARNING) {
                return { level: 'warning', message: '⚠️ WARNING: 70%+ tokens' };
            }
            return { level: 'normal', message: '✅ Normal' };
        }

        function proactiveHandoff(roomId) {
            const room = appState.rooms[roomId];
            const currentAIIndex = room.helpers.indexOf(room.currentAI);
            const nextAIIndex = (currentAIIndex + 1) % room.helpers.length;
            const nextAI = room.helpers[nextAIIndex];

            const relayEvent = {
                timestamp: new Date().toISOString(),
                fromAI: room.currentAI,
                toAI: nextAI,
                messageCount: room.messageCount,
                contextKB: Math.ceil(room.tokenUsed / 250),
                reason: 'Proactive handoff (85% threshold)'
            };

            room.relayEvents.push(relayEvent);
            room.tokenUsed = 0;
            room.currentAI = nextAI;
            room.messageCount = 0;

            if (!room.relayStats[nextAI]) {
                room.relayStats[nextAI] = { handoffs: 0, messagesHandled: 0, totalContextKB: 0 };
            }
            room.relayStats[nextAI].handoffs++;
            saveState();
            return { success: true, nextAI };
        }

        function recordTokenUsage(roomId, tokensUsed) {
            const room = appState.rooms[roomId];
            room.tokenUsed += tokensUsed;

            room.tokenHistory.push({
                timestamp: new Date().toISOString(),
                aiName: room.currentAI,
                tokensUsed: tokensUsed,
                percentUsed: calculateTokenUsagePercent(roomId),
                reason: 'Execution'
            });

            const threshold = checkTokenThreshold(roomId);
            if (threshold.level === 'critical') {
                proactiveHandoff(roomId);
            }

            saveState();
        }

        // ==================== EXECUTION ====================
        function runExecution(roomId) {
            try {
                const room = appState.rooms[roomId];
                const estimatedTokens = Math.floor(Math.random() * 5000) + 2000;
                const jobsFound = Math.floor(Math.random() * 50) + 10;
                const highMatch = Math.floor(jobsFound * 0.3);

                const execution = {
                    timestamp: new Date().toISOString(),
                    jobsFound: jobsFound,
                    highMatch: highMatch,
                    duration: Math.floor(Math.random() * 3) + 1,
                    tokensUsed: estimatedTokens
                };

                room.executions.push(execution);
                room.messageCount++;
                room.lastRun = execution.timestamp;
                room.status = 'active';
                recordTokenUsage(roomId, estimatedTokens);

                if (!appState.messages[roomId]) appState.messages[roomId] = [];
                appState.messages[roomId].push({
                    type: 'execution',
                    text: `Execution: Found ${jobsFound} jobs, ${highMatch} high match`,
                    timestamp: execution.timestamp
                });

                if (room.messageCount > 20 && room.messageCount % 20 === 1) {
                    triggerRelay(roomId);
                }

                saveState();
                renderApp();
            } catch (e) {
                console.error('Execution error:', e);
            }
        }

        function triggerRelay(roomId) {
            try {
                const room = appState.rooms[roomId];
                const currentAIIndex = room.helpers.indexOf(room.currentAI);
                const nextAIIndex = (currentAIIndex + 1) % room.helpers.length;
                const nextAI = room.helpers[nextAIIndex];

                const relayEvent = {
                    timestamp: new Date().toISOString(),
                    fromAI: room.currentAI,
                    toAI: nextAI,
                    messageCount: room.messageCount,
                    contextKB: Math.ceil(room.tokenUsed / 250),
                    reason: 'Message count (20+) threshold'
                };

                room.relayEvents.push(relayEvent);
                room.currentAI = nextAI;
                room.messageCount = 0;
                room.tokenUsed = 0;

                if (!room.relayStats[nextAI]) {
                    room.relayStats[nextAI] = { handoffs: 0, messagesHandled: 0, totalContextKB: 0 };
                }
                room.relayStats[nextAI].handoffs++;

                saveState();
            } catch (e) {
                console.error('Relay error:', e);
            }
        }

        function sendEmail(roomId) {
            try {
                const room = appState.rooms[roomId];
                const email = {
                    timestamp: new Date().toISOString(),
                    to: `recruiter${Math.floor(Math.random() * 100)}@company.com`,
                    subject: `Profile Match - ${room.messageCount} jobs`,
                    status: 'sent'
                };

                room.emails.push(email);
                room.emailsSent++;
                saveState();
                renderApp();
            } catch (e) {
                console.error('Email error:', e);
            }
        }

        // ==================== STATE MANAGEMENT ====================
        function saveState() {
            try {
                localStorage.setItem('appState', JSON.stringify(appState));
            } catch (e) {
                console.error('Save error:', e);
            }
        }

        function formatTime(isoString) {
            try {
                return new Date(isoString).toLocaleTimeString();
            } catch {
                return isoString;
            }
        }

        // ==================== RENDERING ====================
        function renderHome() {
            return `
                ${Object.values(appState.rooms).map(room => `
                    <div class="room-card">
                        <h2>${room.title}</h2>
                        <div class="card-stat">
                            <label>Status:</label>
                            <value>${room.status}</value>
                        </div>
                        <div class="card-stat">
                            <label>Current AI:</label>
                            <value>${room.currentAI}</value>
                        </div>
                        <div class="card-stat">
                            <label>Executions:</label>
                            <value>${room.executions.length}</value>
                        </div>
                        <div class="card-stat">
                            <label>Emails:</label>
                            <value>${room.emailsSent}</value>
                        </div>
                        <div class="ai-helpers">
                            <label>Available AIs:</label>
                            <div class="ai-list">${room.helpers.map(ai => `<span class="ai-badge">${ai}</span>`).join('')}</div>
                        </div>
                        ${userSession.isAuthenticated ? '<span class="sync-badge">☁️ Synced to Sheets</span>' : ''}
                        <button class="run-btn" onclick="enterRoom(${room.id})">Enter Room</button>
                    </div>
                `).join('')}
            `;
        }

        function renderRoom(roomId) {
            try {
                const room = appState.rooms[roomId];
                if (!room) return '<div class="room-view"><p>Room not found</p></div>';

                const threshold = checkTokenThreshold(roomId);
                const tokenPercent = calculateTokenUsagePercent(roomId);

                return `
                    <div class="room-view">
                        <button class="back-btn" onclick="backToHome()">← Back</button>
                        <h2>${room.title}</h2>

                        <button class="run-btn" onclick="runExecution(${roomId}); setTimeout(() => renderApp(), 500)">▶ RUN</button>
                        <button class="run-btn" style="background: #3b82f6;" onclick="sendEmail(${roomId}); setTimeout(() => renderApp(), 500)">✉️ EMAIL</button>

                        <div class="tabs">
                            <button class="tab-btn active" onclick="switchTab(${roomId}, 'output')">OUTPUT</button>
                            <button class="tab-btn" onclick="switchTab(${roomId}, 'history')">HISTORY</button>
                            <button class="tab-btn" onclick="switchTab(${roomId}, 'relay')">RELAY</button>
                            <button class="tab-btn" onclick="switchTab(${roomId}, 'token')">TOKENS</button>
                            <button class="tab-btn" onclick="switchTab(${roomId}, 'sheets')">SHEETS (NEW)</button>
                        </div>

                        <div id="tab-output-${roomId}" class="tab-content active">
                            ${room.executions.length > 0
                                ? room.executions.slice(-5).reverse().map(exec => `
                                    <div class="history-item">
                                        <div class="history-item-time">${formatTime(exec.timestamp)}</div>
                                        <div class="history-item-content">✓ ${exec.jobsFound} jobs | ${exec.tokensUsed} tokens</div>
                                    </div>
                                `).join('')
                                : '<div class="empty-state"><div class="empty-state-icon">📭</div>No executions</div>'
                            }
                        </div>

                        <div id="tab-history-${roomId}" class="tab-content">
                            ${appState.messages[roomId] && appState.messages[roomId].length > 0
                                ? appState.messages[roomId].slice(-5).reverse().map(msg => `
                                    <div class="history-item">
                                        <div class="history-item-time">${formatTime(msg.timestamp)}</div>
                                        <div class="history-item-content">${msg.text}</div>
                                    </div>
                                `).join('')
                                : '<div class="empty-state"><div class="empty-state-icon">💬</div>No history</div>'
                            }
                        </div>

                        <div id="tab-relay-${roomId}" class="tab-content">
                            ${room.relayEvents.length > 0
                                ? room.relayEvents.slice(-3).reverse().map(event => `
                                    <div class="history-item">
                                        <div class="history-item-time">${formatTime(event.timestamp)}</div>
                                        <div class="history-item-content">🔄 ${event.fromAI} → ${event.toAI}</div>
                                    </div>
                                `).join('')
                                : '<div class="empty-state"><div class="empty-state-icon">🔄</div>No relays</div>'
                            }
                        </div>

                        <div id="tab-token-${roomId}" class="tab-content">
                            <div class="content-block">
                                <label>Token Usage</label>
                                <value>${room.tokenUsed.toLocaleString()} / ${getTokenBudget(room.currentAI).toLocaleString()} (${tokenPercent.toFixed(1)}%)</value>
                            </div>
                            <div class="content-block">
                                <label>Status</label>
                                <value>${threshold.message}</value>
                            </div>
                        </div>

                        <div id="tab-sheets-${roomId}" class="tab-content">
                            <div class="oauth-status">
                                <div class="oauth-status-label">Google Sheets Integration</div>
                                <div class="oauth-status-value">
                                    ${userSession.isAuthenticated 
                                        ? `✅ Connected as ${userSession.email}<br>Sheets ID: ${userSession.sheetsId}<br>Status: Data syncing to Sheets` 
                                        : '❌ Not authenticated - Login to enable'}
                                </div>
                            </div>
                            <div class="sheets-structure">Sheets Structure:

Rooms Table:
- room_id | title | current_ai | status
- executions | emails | relays | last_updated

Executions Table:
- execution_id | room_id | timestamp
- jobs_found | high_match | duration | tokens_used

Relays Table:
- relay_id | room_id | from_ai | to_ai
- message_count | context_kb | timestamp

Emails Table:
- email_id | room_id | recipient
- subject | status | timestamp

TokenHistory Table:
- entry_id | room_id | ai_name
- tokens_used | percent_used | timestamp</div>
                        </div>
                    </div>
                `;
            } catch (e) {
                console.error('Room render error:', e);
                return '<div class="room-view"><p>Error</p></div>';
            }
        }

        function renderApp() {
            try {
                const loginView = document.getElementById('loginView');
                const header = document.getElementById('header');
                const homeView = document.getElementById('homeView');
                const roomViewsContainer = document.getElementById('roomViews');

                if (!userSession.isAuthenticated) {
                    loginView.classList.add('active');
                    loginView.innerHTML = renderLogin();
                    header.style.display = 'none';
                    return;
                }

                loginView.classList.remove('active');
                header.style.display = 'flex';
                document.getElementById('userEmail').textContent = userSession.email;

                homeView.innerHTML = renderHome();
                homeView.classList.add('active');

                roomViewsContainer.innerHTML = Object.keys(appState.rooms).map(roomId => `<div id="room-${roomId}" class="room-views">${renderRoom(roomId)}</div>`).join('');
            } catch (e) {
                console.error('Render error:', e);
            }
        }

        function enterRoom(roomId) {
            document.getElementById('homeView').classList.remove('active');
            for (let id of Object.keys(appState.rooms)) {
                const elem = document.getElementById(`room-${id}`);
                if (elem) elem.classList.remove('active');
            }
            document.getElementById(`room-${roomId}`).classList.add('active');
        }

        function backToHome() {
            for (let id of Object.keys(appState.rooms)) {
                const elem = document.getElementById(`room-${id}`);
                if (elem) elem.classList.remove('active');
            }
            document.getElementById('homeView').classList.add('active');
        }

        function switchTab(roomId, tabName) {
            const tabButtons = document.querySelectorAll(`#room-${roomId} .tab-btn`);
            const tabContents = document.querySelectorAll(`#room-${roomId} .tab-content`);
            tabButtons.forEach(btn => btn.classList.remove('active'));
            tabContents.forEach(content => content.classList.remove('active'));
            document.querySelector(`#room-${roomId} [onclick*="'${tabName}'"]`)?.classList.add('active');
            document.getElementById(`tab-${tabName}-${roomId}`)?.classList.add('active');
        }

        // Initialize
        renderApp();
    </script>
</body>
</html>
