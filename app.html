<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Multi-Room">
    <meta name="theme-color" content="#667eea">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'><rect fill='%23667eea' width='180' height='180'/><text x='90' y='90' font-size='80' fill='white' text-anchor='middle' dominant-baseline='central' font-weight='bold'>🚀</text></svg>">
    <link rel="manifest" href="manifest.json">
    <title>Multi-Room Platform - Mobile</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-user-select: none;
            user-select: none;
        }

        :root {
            --primary: #667eea;
            --primary-dark: #764ba2;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --light: #f5f5f5;
            --border: #e5e7eb;
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }

        html, body {
            width: 100%;
            height: 100%;
            position: fixed;
            overflow: hidden;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #fff;
            color: #333;
            padding-top: var(--safe-top);
            padding-bottom: var(--safe-bottom);
        }

        #app {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .mobile-header {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            padding: 15px;
            text-align: center;
            flex-shrink: 0;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }

        .mobile-header h1 {
            font-size: 1.3em;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .mobile-content {
            flex: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding: 15px;
        }

        .login-screen {
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 20px;
        }

        .login-form {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .login-form h2 {
            color: var(--primary);
            margin-bottom: 20px;
            text-align: center;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 0.95em;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid var(--border);
            border-radius: 8px;
            font-size: 16px;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--primary);
        }

        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
        }

        .btn-primary:active {
            transform: scale(0.98);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
        }

        .stat-value {
            font-size: 1.8em;
            font-weight: bold;
            margin: 5px 0;
        }

        .stat-label {
            font-size: 0.8em;
            opacity: 0.9;
        }

        .room-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .room-item {
            background: white;
            border: 2px solid var(--border);
            border-radius: 10px;
            padding: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .room-item:active {
            border-color: var(--primary);
            background: #f8f9ff;
            transform: scale(0.98);
        }

        .room-info h3 {
            margin: 0;
            color: var(--primary);
            font-size: 1.1em;
        }

        .room-info p {
            margin: 5px 0 0;
            color: #999;
            font-size: 0.85em;
        }

        .room-badge {
            background: var(--success);
            color: white;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.8em;
            font-weight: 600;
        }

        .action-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 15px;
        }

        .btn-action {
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.95em;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-action-primary {
            background: var(--success);
            color: white;
        }

        .btn-action-primary:active {
            transform: scale(0.95);
        }

        .btn-action-secondary {
            background: var(--light);
            color: var(--primary);
            border: 2px solid var(--primary);
        }

        .btn-action-secondary:active {
            transform: scale(0.95);
        }

        .tab-bar {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 5px;
            background: white;
            border-top: 2px solid var(--border);
            padding: 8px;
            flex-shrink: 0;
        }

        .tab-btn {
            background: none;
            border: none;
            padding: 10px 5px;
            text-align: center;
            font-size: 0.75em;
            color: #999;
            cursor: pointer;
            font-weight: 600;
            border-top: 3px solid transparent;
            margin-top: -8px;
            transition: all 0.3s ease;
        }

        .tab-btn.active {
            color: var(--primary);
            border-top-color: var(--primary);
        }

        .tab-btn span {
            display: block;
            font-size: 1.4em;
        }

        .history-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .history-item {
            background: white;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px;
        }

        .history-time {
            font-size: 0.8em;
            color: #999;
            margin-bottom: 5px;
        }

        .history-text {
            color: #333;
            font-size: 0.9em;
        }

        .badge {
            display: inline-block;
            background: var(--success);
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.75em;
            margin-top: 5px;
        }

        .empty-state {
            text-align: center;
            padding: 30px 20px;
            color: #999;
        }

        .empty-icon {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .header-bar .user-info {
            font-size: 0.85em;
            color: #666;
        }

        .logout-btn {
            background: var(--danger);
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.8em;
            cursor: pointer;
        }

        .notification-badge {
            position: fixed;
            top: var(--safe-top, 0);
            right: 0;
            background: var(--warning);
            color: white;
            padding: 8px 12px;
            font-size: 0.85em;
            z-index: 1000;
            border-radius: 0 0 0 8px;
        }

        @supports (padding: max(0px)) {
            body {
                padding-left: max(0px, env(safe-area-inset-left));
                padding-right: max(0px, env(safe-area-inset-right));
            }
        }
    </style>
</head>
<body>
    <div id="app">
        <div class="mobile-header">
            <h1>🚀 <span id="headerTitle">Multi-Room</span></h1>
        </div>

        <div class="mobile-content" id="content"></div>

        <div class="tab-bar" id="tabBar" style="display: none;">
            <button class="tab-btn active" onclick="switchMobileTab('home')">
                <span>🏠</span>
                Home
            </button>
            <button class="tab-btn" onclick="switchMobileTab('history')">
                <span>📋</span>
                History
            </button>
            <button class="tab-btn" onclick="switchMobileTab('stats')">
                <span>📊</span>
                Stats
            </button>
            <button class="tab-btn" onclick="switchMobileTab('settings')">
                <span>⚙️</span>
                Settings
            </button>
        </div>
    </div>

    <script>
        // App State
        let mobileSession = {
            isAuthenticated: false,
            email: null
        };

        let mobileState = {
            currentTab: 'home',
            currentRoom: null,
            rooms: {
                1: { id: 1, title: 'Room 1', status: 'active', ai: 'Claude', executions: [], emails: [] },
                2: { id: 2, title: 'Room 2', status: 'empty', ai: 'ChatGPT', executions: [], emails: [] },
                3: { id: 3, title: 'Room 3', status: 'empty', ai: 'DeepSeek', executions: [], emails: [] }
            }
        };

        try {
            const saved = localStorage.getItem('mobileSession');
            if (saved) mobileSession = { ...mobileSession, ...JSON.parse(saved) };
        } catch (e) {}

        // Login
        function mobileLogin() {
            const email = document.getElementById('emailInput').value;
            if (!email) {
                alert('Enter email');
                return;
            }
            mobileSession.isAuthenticated = true;
            mobileSession.email = email;
            localStorage.setItem('mobileSession', JSON.stringify(mobileSession));
            renderMobileApp();
        }

        function mobileLogout() {
            mobileSession = { isAuthenticated: false, email: null };
            mobileState.currentRoom = null;
            localStorage.removeItem('mobileSession');
            renderMobileApp();
        }

        // Rendering
        function renderMobileApp() {
            if (!mobileSession.isAuthenticated) {
                document.getElementById('content').innerHTML = `
                    <div class="login-screen">
                        <div class="login-form">
                            <h2>Sign In</h2>
                            <div class="form-group">
                                <label>Email</label>
                                <input type="email" id="emailInput" placeholder="Enter email" value="shashikant15041982@gmail.com">
                            </div>
                            <button class="btn btn-primary" onclick="mobileLogin()">Sign In</button>
                        </div>
                    </div>
                `;
                document.getElementById('tabBar').style.display = 'none';
                return;
            }

            document.getElementById('tabBar').style.display = 'grid';

            if (mobileState.currentRoom) {
                renderRoomView();
            } else {
                renderHomeView();
            }
        }

        function renderHomeView() {
            let html = `
                <div class="header-bar">
                    <div class="user-info">${mobileSession.email}</div>
                    <button class="logout-btn" onclick="mobileLogout()">Logout</button>
                </div>

                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-label">Active Rooms</div>
                        <div class="stat-value">${Object.values(mobileState.rooms).filter(r => r.status === 'active').length}</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">Executions</div>
                        <div class="stat-value">${Object.values(mobileState.rooms).reduce((sum, r) => sum + r.executions.length, 0)}</div>
                    </div>
                </div>

                <h3 style="margin: 20px 0 10px; color: var(--primary);">Rooms</h3>
                <div class="room-list">
            `;

            Object.values(mobileState.rooms).forEach(room => {
                html += `
                    <div class="room-item" onclick="enterRoomMobile(${room.id})">
                        <div class="room-info">
                            <h3>${room.title}</h3>
                            <p>AI: ${room.ai} • Executions: ${room.executions.length}</p>
                        </div>
                        <div class="room-badge">${room.status}</div>
                    </div>
                `;
            });

            html += '</div>';
            document.getElementById('content').innerHTML = html;
        }

        function renderRoomView() {
            const room = mobileState.rooms[mobileState.currentRoom];
            let html = `
                <button class="btn btn-primary" style="width: auto; margin-bottom: 15px;" onclick="exitRoomMobile()">← Back</button>

                <h2 style="color: var(--primary); margin-bottom: 15px;">${room.title}</h2>

                <div class="action-buttons">
                    <button class="btn-action btn-action-primary" onclick="runExecutionMobile()">▶ Execute</button>
                    <button class="btn-action btn-action-secondary" onclick="sendEmailMobile()">✉ Email</button>
                </div>

                <h3 style="margin: 20px 0 10px; color: var(--primary);">Recent Activity</h3>
            `;

            if (room.executions.length === 0) {
                html += '<div class="empty-state"><div class="empty-icon">📭</div>No executions yet</div>';
            } else {
                html += '<div class="history-list">';
                room.executions.slice(-5).reverse().forEach(exec => {
                    html += `
                        <div class="history-item">
                            <div class="history-time">${new Date(exec.timestamp).toLocaleTimeString()}</div>
                            <div class="history-text">✓ Found ${exec.jobs} jobs</div>
                            <span class="badge">${exec.tokens} tokens</span>
                        </div>
                    `;
                });
                html += '</div>';
            }

            document.getElementById('content').innerHTML = html;
        }

        function enterRoomMobile(roomId) {
            mobileState.currentRoom = roomId;
            renderMobileApp();
        }

        function exitRoomMobile() {
            mobileState.currentRoom = null;
            renderMobileApp();
        }

        function runExecutionMobile() {
            const room = mobileState.rooms[mobileState.currentRoom];
            room.executions.push({
                timestamp: new Date().toISOString(),
                jobs: Math.floor(Math.random() * 50) + 10,
                tokens: Math.floor(Math.random() * 5000) + 2000
            });
            renderMobileApp();
        }

        function sendEmailMobile() {
            const room = mobileState.rooms[mobileState.currentRoom];
            room.emails.push({
                timestamp: new Date().toISOString(),
                to: `recruiter${Math.floor(Math.random() * 100)}@example.com`
            });
            renderMobileApp();
        }

        function switchMobileTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            event.target.closest('.tab-btn').classList.add('active');
        }

        // Service Worker Registration (Offline Support)
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(() => {});
        }

        // Initialize
        renderMobileApp();
    </script>
</body>
</html>
