<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Room AI Chat Platform - Phase 24 Firebase</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            display: flex;
            height: 90vh;
        }

        .sidebar {
            width: 300px;
            background: #f7f7f7;
            border-right: 1px solid #e0e0e0;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .sidebar-header {
            padding: 20px;
            background: #667eea;
            color: white;
            font-weight: bold;
            font-size: 16px;
        }

        .user-info {
            padding: 15px 20px;
            background: #f0f0f0;
            border-bottom: 1px solid #e0e0e0;
            font-size: 12px;
            color: #666;
        }

        .user-info-item {
            margin: 5px 0;
            word-break: break-all;
        }

        .user-info-label {
            font-weight: bold;
            color: #333;
        }

        .rooms-container {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }

        .room-item {
            padding: 12px;
            margin: 5px 0;
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .room-item:hover {
            background: #f5f5f5;
            border-color: #667eea;
        }

        .room-item.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .room-name {
            flex: 1;
            font-weight: 500;
        }

        .room-delete {
            background: #ff6b6b;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 4px 8px;
            font-size: 12px;
            cursor: pointer;
            margin-left: 8px;
        }

        .room-delete:hover {
            background: #ff5252;
        }

        .new-room-btn {
            margin: 10px;
            padding: 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
        }

        .new-room-btn:hover {
            background: #5568d3;
        }

        .logout-btn {
            margin: 10px;
            padding: 12px;
            background: #ff6b6b;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .logout-btn:hover {
            background: #ff5252;
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-header {
            padding: 20px;
            background: white;
            border-bottom: 1px solid #e0e0e0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chat-header h2 {
            color: #333;
            font-size: 18px;
        }

        .ai-status {
            display: flex;
            gap: 10px;
            align-items: center;
            font-size: 14px;
        }

        .ai-badge {
            background: #667eea;
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: bold;
        }

        .token-display {
            font-size: 12px;
            color: #666;
        }

        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            justify-content: flex-end;
        }

        .message-content {
            max-width: 60%;
            padding: 12px 16px;
            border-radius: 12px;
            word-wrap: break-word;
        }

        .message.user .message-content {
            background: #667eea;
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message.ai .message-content {
            background: #f0f0f0;
            color: #333;
            border-bottom-left-radius: 4px;
            border: 1px solid #e0e0e0;
        }

        .message-meta {
            font-size: 11px;
            color: #999;
            margin-top: 4px;
            padding: 0 16px;
        }

        .input-area {
            padding: 20px;
            background: white;
            border-top: 1px solid #e0e0e0;
            display: flex;
            gap: 10px;
        }

        .message-input {
            flex: 1;
            padding: 12px;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            font-family: inherit;
            font-size: 14px;
            resize: none;
            max-height: 100px;
        }

        .message-input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 2px rgba(102, 126, 234, 0.1);
        }

        .send-btn {
            padding: 12px 24px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .send-btn:hover:not(:disabled) {
            background: #5568d3;
        }

        .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .auth-container {
            width: 100%;
            max-width: 400px;
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .auth-container h1 {
            margin-bottom: 30px;
            color: #333;
            text-align: center;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #666;
            font-weight: 500;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            font-size: 14px;
            font-family: inherit;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 2px rgba(102, 126, 234, 0.1);
        }

        .auth-btn {
            width: 100%;
            padding: 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 10px;
        }

        .auth-btn:hover {
            background: #5568d3;
        }

        .error-message {
            color: #ff6b6b;
            font-size: 14px;
            margin-top: 10px;
            text-align: center;
        }

        .status-bar {
            padding: 10px 20px;
            background: #f5f5f5;
            font-size: 12px;
            color: #666;
            border-top: 1px solid #e0e0e0;
        }

        .sync-indicator {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 6px;
            background: #51cf66;
        }

        .sync-indicator.syncing {
            background: #ffa94d;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #999;
            text-align: center;
        }

        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }
    </style>
</head>
<body>
    <div id="authUI" class="auth-container">
        <h1>Multi-Room AI Chat</h1>
        <div class="form-group">
            <label>Email</label>
            <input type="email" id="authEmail" placeholder="your@email.com">
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" id="authPassword" placeholder="Password">
        </div>
        <button class="auth-btn" onclick="handleSignUp()">Sign Up</button>
        <button class="auth-btn" onclick="handleSignIn()">Sign In</button>
        <div id="authError" class="error-message" style="display: none;"></div>
    </div>

    <div id="appUI" class="container" style="display: none;">
        <div class="sidebar">
            <div class="sidebar-header">
                Multi-Room Chat
            </div>
            <div class="user-info">
                <div class="user-info-item"><span class="user-info-label">User:</span> <span id="userEmail"></span></div>
                <div class="user-info-item"><span class="user-info-label">UID:</span> <span id="userUID" style="font-size: 10px;"></span></div>
            </div>
            <button class="new-room-btn" onclick="createNewRoom()">+ New Room</button>
            <div class="rooms-container" id="roomsList"></div>
            <button class="logout-btn" onclick="handleLogout()">Logout</button>
        </div>

        <div class="main-content">
            <div class="chat-header" id="chatHeader" style="display: none;">
                <div>
                    <h2 id="roomTitle"></h2>
                </div>
                <div class="ai-status">
                    <div class="ai-badge" id="currentAI">Claude</div>
                    <div class="token-display" id="tokenCount">Tokens: 0</div>
                </div>
            </div>

            <div class="empty-state" id="emptyState">
                <div class="empty-state-icon">💬</div>
                <p>Select a room to start chatting</p>
            </div>

            <div class="messages-container" id="messagesContainer" style="display: none;"></div>

            <div class="input-area" id="inputArea" style="display: none;">
                <textarea class="message-input" id="messageInput" placeholder="Type your message..." rows="1"></textarea>
                <button class="send-btn" onclick="sendMessage()">Send</button>
            </div>

            <div class="status-bar">
                <span class="sync-indicator" id="syncIndicator"></span>
                <span id="syncStatus">Synced with Firebase ✓</span>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js"></script>

    <script>
        // Firebase Configuration (Your Real Config)
        const firebaseConfig = {
            apiKey: "AIzaSyAapQ1-4WRs0gOrLU_y-ynC2UUyhAULTzc",
            authDomain: "multi-room-platform.firebaseapp.com",
            databaseURL: "https://multi-room-platform-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "multi-room-platform",
            storageBucket: "multi-room-platform.firebasestorage.app",
            messagingSenderId: "114970001280",
            appId: "1:114970001280:web:c9ede7b3ac9b85f1f4cb65"
        };

        let app, auth, db;
        let currentUser = null;
        let currentRoom = null;
        let currentAI = 'Claude';
        let tokenCount = 0;
        let aiHistory = [];

        const AI_ORDER = ['Claude', 'ChatGPT', 'DeepSeek', 'Mistral'];
        const TOKEN_LIMITS = {
            'Claude': 100000,
            'ChatGPT': 120000,
            'DeepSeek': 60000,
            'Mistral': 80000
        };

        // Initialize Firebase
        async function initializeFirebase() {
            try {
                app = firebase.initializeApp(firebaseConfig);
                auth = firebase.auth();
                db = firebase.database();
                
                auth.onAuthStateChanged(handleAuthStateChange);
            } catch (error) {
                console.error('Firebase init error:', error);
                showAuthError('Firebase failed: ' + error.message);
            }
        }

        function handleAuthStateChange(user) {
            if (user) {
                currentUser = user;
                showAppUI();
                loadRooms();
            } else {
                currentUser = null;
                showAuthUI();
            }
        }

        async function handleSignUp() {
            const email = document.getElementById('authEmail').value;
            const password = document.getElementById('authPassword').value;
            if (!email || !password) {
                showAuthError('Fill all fields');
                return;
            }
            try {
                await auth.createUserWithEmailAndPassword(email, password);
            } catch (error) {
                showAuthError(error.message);
            }
        }

        async function handleSignIn() {
            const email = document.getElementById('authEmail').value;
            const password = document.getElementById('authPassword').value;
            if (!email || !password) {
                showAuthError('Fill all fields');
                return;
            }
            try {
                await auth.signInWithEmailAndPassword(email, password);
            } catch (error) {
                showAuthError(error.message);
            }
        }

        async function handleLogout() {
            await auth.signOut();
        }

        function showAuthUI() {
            document.getElementById('authUI').style.display = 'flex';
            document.getElementById('appUI').style.display = 'none';
        }

        function showAppUI() {
            document.getElementById('authUI').style.display = 'none';
            document.getElementById('appUI').style.display = 'flex';
            document.getElementById('userEmail').textContent = currentUser.email;
            document.getElementById('userUID').textContent = currentUser.uid;
        }

        function showAuthError(msg) {
            const el = document.getElementById('authError');
            el.textContent = msg;
            el.style.display = 'block';
            setTimeout(() => el.style.display = 'none', 5000);
        }

        async function createNewRoom() {
            const name = prompt('Room name:');
            if (!name) return;
            try {
                const ref = db.ref(`users/${currentUser.uid}/rooms`).push();
                await ref.set({
                    name: name,
                    createdAt: new Date().toISOString(),
                    currentAI: 'Claude',
                    tokenCount: 0
                });
            } catch (e) {
                alert('Error: ' + e.message);
            }
        }

        function loadRooms() {
            db.ref(`users/${currentUser.uid}/rooms`).on('value', snap => {
                const rooms = snap.val() || {};
                renderRooms(rooms);
            });
        }

        function renderRooms(rooms) {
            const container = document.getElementById('roomsList');
            container.innerHTML = '';
            Object.entries(rooms).forEach(([id, room]) => {
                if (!room.name) return;
                const el = document.createElement('div');
                el.className = 'room-item' + (currentRoom?.id === id ? ' active' : '');
                el.innerHTML = `
                    <span class="room-name">${room.name}</span>
                    <button class="room-delete" onclick="deleteRoom('${id}')">Delete</button>
                `;
                el.onclick = (e) => {
                    if (!e.target.classList.contains('room-delete')) {
                        selectRoom(id, room);
                    }
                };
                container.appendChild(el);
            });
        }

        function selectRoom(id, room) {
            currentRoom = { id, ...room };
            currentAI = room.currentAI || 'Claude';
            tokenCount = room.tokenCount || 0;

            document.getElementById('chatHeader').style.display = 'flex';
            document.getElementById('emptyState').style.display = 'none';
            document.getElementById('messagesContainer').style.display = 'flex';
            document.getElementById('inputArea').style.display = 'flex';
            document.getElementById('roomTitle').textContent = room.name;
            updateAIDisplay();

            document.getElementById('messagesContainer').innerHTML = '';
            db.ref(`users/${currentUser.uid}/rooms/${id}/messages`).on('child_added', snap => {
                const msg = snap.val();
                if (msg && msg.content) {
                    displayMessage(msg);
                }
            });
        }

        function displayMessage(msg) {
            const container = document.getElementById('messagesContainer');
            const el = document.createElement('div');
            el.className = 'message ' + msg.role;
            const ts = new Date(msg.timestamp).toLocaleTimeString();
            el.innerHTML = `
                <div class="message-content">${escapeHtml(msg.content)}</div>
                <div class="message-meta">${ts}</div>
            `;
            container.appendChild(el);
            container.scrollTop = container.scrollHeight;
        }

        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const msg = input.value.trim();
            if (!msg || !currentRoom) return;

            try {
                // Check AI switch
                if (tokenCount > TOKEN_LIMITS[currentAI]) {
                    const idx = AI_ORDER.indexOf(currentAI);
                    currentAI = AI_ORDER[(idx + 1) % AI_ORDER.length];
                    tokenCount = 0;
                }

                // Save message
                const ref = db.ref(`users/${currentUser.uid}/rooms/${currentRoom.id}/messages`).push();
                await ref.set({
                    role: 'user',
                    content: msg,
                    ai: currentAI,
                    timestamp: new Date().toISOString()
                });

                // Update room
                await db.ref(`users/${currentUser.uid}/rooms/${currentRoom.id}`).update({
                    currentAI: currentAI,
                    tokenCount: tokenCount
                });

                input.value = '';
                updateAIDisplay();
            } catch (e) {
                alert('Error: ' + e.message);
            }
        }

        function updateAIDisplay() {
            document.getElementById('currentAI').textContent = currentAI;
            document.getElementById('tokenCount').textContent = 'Tokens: ' + tokenCount;
        }

        async function deleteRoom(id) {
            if (!confirm('Delete room?')) return;
            await db.ref(`users/${currentUser.uid}/rooms/${id}`).remove();
            if (currentRoom?.id === id) {
                currentRoom = null;
                document.getElementById('emptyState').style.display = 'flex';
                document.getElementById('messagesContainer').style.display = 'none';
                document.getElementById('inputArea').style.display = 'none';
            }
        }

        function escapeHtml(text) {
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return text.replace(/[&<>"']/g, m => map[m]);
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey && currentRoom) {
                e.preventDefault();
                sendMessage();
            }
        });

        window.addEventListener('load', () => {
            initializeFirebase();
        });
    </script>
</body>
</html>
